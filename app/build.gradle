plugins { id 'com.android.application' }

android {
    namespace 'ir.ef3.carcare'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.ef3.carcare'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '2.1.0'
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}