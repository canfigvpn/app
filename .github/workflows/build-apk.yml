name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -executable | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found in Android SDK installation"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and bundle offline fonts and icon font
        run: |
          mkdir -p assets/fonts app/src/main/assets/assets/fonts
          python3 - <<'PY'
          import urllib.request, re, os
          fonts = {
            'vazirmatn.css': 'https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap',
            'material-symbols.css': 'https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200'
          }
          headers={'User-Agent':'Mozilla/5.0 Chrome/120 Safari/537.36'}
          for name,url in fonts.items():
            req=urllib.request.Request(url,headers=headers)
            css=urllib.request.urlopen(req,timeout=30).read().decode('utf-8')
            css_original=css
            css=re.sub(r'url[(]([^)]*)[)]',lambda m: 'url(./'+os.path.basename(m.group(1).strip(chr(34)+chr(39)))+')',css)
            open('assets/fonts/'+name,'w',encoding='utf-8').write(css)
            for raw in re.findall(r'https?://[^)\t ]+', css_original):
              raw=raw.strip().strip(chr(34)).strip(chr(39))
              file=os.path.basename(raw.split('?')[0])
              try:
                data=urllib.request.urlopen(raw,timeout=30).read()
                open('assets/fonts/'+file,'wb').write(data)
              except Exception as e: print('Font download warning:',raw,e)
          PY
          cp -r assets/fonts app/src/main/assets/assets/fonts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/fonts
          if ! git diff --cached --quiet; then
            git commit -m "Bundle offline fonts and icon assets"
            git push
          fi
      - name: Copy HTML app into Android assets
        run: cp index.html app/src/main/assets/index.html
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarServiceManager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
