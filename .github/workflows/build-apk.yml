name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -executable | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found in Android SDK installation"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle already-downloaded fonts and icons for fully offline APK
        run: |
          set -e
          test -f assets/fonts/vazirmatn.css
          test -f assets/fonts/material-symbols.css
          test -n "$(find assets/fonts -type f -name '*.ttf' -print -quit)"
          mkdir -p app/src/main/assets/assets/fonts
          # Copy CONTENTS of fonts folder (not the folder itself) to the exact CSS-relative path.
          cp -R assets/fonts/. app/src/main/assets/assets/fonts/
          test -f app/src/main/assets/assets/fonts/vazirmatn.css
          test -f app/src/main/assets/assets/fonts/material-symbols.css
          test -n "$(find app/src/main/assets/assets/fonts -maxdepth 1 -type f -name '*.ttf' -print -quit)"
      - name: Copy HTML app into Android assets
        run: cp index.html app/src/main/assets/index.html
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarServiceManager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
